name: Setup custom domain

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/domain-setup.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-24.04
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DOMAIN: gmach-berega.co.il
    steps:
      - uses: actions/checkout@v5
      - name: Resolve or create Cloudflare zone
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            printf 'status=error\nmessage=Missing Cloudflare repository credentials\n' > .domain-setup-status
            exit 0
          fi

          auth=(-H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json")
          existing="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones?name=$DOMAIN&account.id=$CLOUDFLARE_ACCOUNT_ID" || true)"
          zone_id="$(printf '%s' "$existing" | jq -r '.result[0].id // empty' 2>/dev/null || true)"

          if [ -z "$zone_id" ]; then
            payload="$(jq -nc --arg account "$CLOUDFLARE_ACCOUNT_ID" --arg name "$DOMAIN" '{account:{id:$account},name:$name,type:"full",jump_start:false}')"
            created="$(curl -sS -X POST "${auth[@]}" --data "$payload" "https://api.cloudflare.com/client/v4/zones" || true)"
            zone_id="$(printf '%s' "$created" | jq -r '.result.id // empty' 2>/dev/null || true)"
            if [ -z "$zone_id" ]; then
              msg="$(printf '%s' "$created" | jq -r '[.errors[]?.message] | join("; ")' 2>/dev/null || true)"
              printf 'status=error\nmessage=%s\n' "${msg:-Cloudflare zone creation failed or token lacks Zone:Edit permission}" > .domain-setup-status
              exit 0
            fi
          fi

          zone="$(curl -fsS "${auth[@]}" "https://api.cloudflare.com/client/v4/zones/$zone_id")"
          status="$(printf '%s' "$zone" | jq -r '.result.status // "unknown"')"
          ns1="$(printf '%s' "$zone" | jq -r '.result.name_servers[0] // empty')"
          ns2="$(printf '%s' "$zone" | jq -r '.result.name_servers[1] // empty')"
          {
            echo "status=$status"
            echo "domain=$DOMAIN"
            echo "zone_id=$zone_id"
            echo "nameserver_1=$ns1"
            echo "nameserver_2=$ns2"
          } > .domain-setup-status

      - name: Persist domain setup status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .domain-setup-status
          git commit -m "Record custom domain setup status" || exit 0
          git pull --rebase origin main || true
          git push || true
