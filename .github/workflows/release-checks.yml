name: Release checks
on:
  push:
    branches: [main]
    paths-ignore:
      - .release-check-result
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - id: install
        run: npm ci
      - id: syntax
        run: npm run check
      - id: tests
        continue-on-error: true
        run: npm test > test.log 2>&1
      - id: smoke
        continue-on-error: true
        run: node test/release-smoke.mjs > smoke.log 2>&1
      - id: live
        continue-on-error: true
        run: |
          for i in {1..12}; do
            body="$(curl -fsS https://gmach-karov1.nh8030954.workers.dev/api/health || true)"
            echo "$body" > live.log
            if echo "$body" | grep -q '"ok":true' && echo "$body" | grep -q '"completePlatformSchema":{"ready":true' && echo "$body" | grep -q '"adminCredentialRotated":true'; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Inspect live platform configuration
        if: always()
        run: |
          curl -fsS https://gmach-karov1.nh8030954.workers.dev/api/platform/features > platform-features.log || echo '{}' > platform-features.log

      - name: Record verification result
        if: always()
        run: |
          printf 'sha=%s\ninstall=%s\nsyntax=%s\ntests=%s\nsmoke=%s\nlive=%s\n' "$GITHUB_SHA" "${{ steps.install.outcome }}" "${{ steps.syntax.outcome }}" "${{ steps.tests.outcome }}" "${{ steps.smoke.outcome }}" "${{ steps.live.outcome }}" > .release-check-result
          if [ -f test.log ]; then tail -n 20 test.log >> .release-check-result; fi
          if [ -f smoke.log ]; then tail -n 12 smoke.log >> .release-check-result; fi
          if [ -f live.log ]; then tail -n 3 live.log >> .release-check-result; fi
          if [ -f platform-features.log ]; then echo "platform_features=$(cat platform-features.log)" >> .release-check-result; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-check-result
          if ! git diff --cached --quiet; then
            git commit -m "Record release check result"
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then exit 0; fi
              git rebase --abort || true
              sleep 2
            done
            echo "::warning::Could not persist release result because main advanced; verification result remains available in this workflow run."
          fi
      - name: Enforce smoke success
        if: always()
        run: test "${{ steps.tests.outcome }}" = "success" && test "${{ steps.smoke.outcome }}" = "success" && test "${{ steps.live.outcome }}" = "success"
