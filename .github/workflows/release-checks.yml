name: Release checks
on:
  push:
    branches: [main]
    paths-ignore:
      - .release-check-result
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - id: install
        run: npm ci
      - id: syntax
        run: npm run check
      - id: smoke
        continue-on-error: true
        run: node test/release-smoke.mjs > smoke.log 2>&1
      - name: Record verification result
        if: always()
        run: |
          printf 'sha=%s\ninstall=%s\nsyntax=%s\nsmoke=%s\n' "$GITHUB_SHA" "${{ steps.install.outcome }}" "${{ steps.syntax.outcome }}" "${{ steps.smoke.outcome }}" > .release-check-result
          if [ -f smoke.log ]; then tail -n 12 smoke.log >> .release-check-result; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-check-result
          git commit -m "Record release check result" || true
          git push
      - name: Enforce smoke success
        if: always()
        run: test "${{ steps.smoke.outcome }}" = "success"
