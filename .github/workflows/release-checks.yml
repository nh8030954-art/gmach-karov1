name: Release checks
on:
  push:
    branches: [main]
    paths-ignore:
      - .release-check-passed
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node test/release-smoke.mjs
      - name: Record successful verification
        run: |
          printf '%s\n' "$GITHUB_SHA" > .release-check-passed
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .release-check-passed
          git commit -m "Record passing release checks"
          git push
