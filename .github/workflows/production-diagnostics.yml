name: Diagnose public organization data
on:
  push:
    branches: [main]
    paths: [.github/workflows/production-diagnostics.yml]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - name: Inspect public schema without reading private rows
        run: |
          npx wrangler d1 execute DB --remote --command "SELECT name FROM pragma_table_info('reviews') ORDER BY name" --json
          npx wrangler d1 execute DB --remote --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('organization_categories','categories','organization_branches','backup_runs') ORDER BY name" --json
      - name: Inspect public response completeness
        run: |
          ORG_ID="$(curl -fsS --max-time 20 'https://gmach-karov1.nh8030954.workers.dev/api/discovery' | jq -r '.organizations[0].id // empty')"
          test -n "$ORG_ID"
          curl -fsS --max-time 20 "https://gmach-karov1.nh8030954.workers.dev/api/organizations/$ORG_ID/public" | jq '{partial, itemCount:(.items|length), reviewCount:(.reviews|length), categoryCount:(.organization.categories|length)}'
