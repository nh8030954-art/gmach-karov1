name: Map production smoke

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/map-smoke.yml"

permissions:
  contents: read

jobs:
  map-smoke:
    runs-on: ubuntu-24.04
    steps:
      - name: Check production map services
        run: |
          set -euo pipefail
          curl --fail --silent --show-error             "https://gmach-berega.co.il/api/geocode?q=%D7%99%D7%A8%D7%95%D7%A9%D7%9C%D7%99%D7%9D"             -o /tmp/geocode.json
          node -e 'const d=require("/tmp/geocode.json"); if(!Array.isArray(d.results)||!d.results.length) process.exit(1); console.log("geocode results",d.results.length)'
          curl --fail --silent --show-error             "https://gmach-berega.co.il/api/maps/tiles/7/76/52.png"             -D /tmp/tile.headers -o /tmp/tile.png
          grep -qi "content-type: image/png" /tmp/tile.headers
          test "$(wc -c < /tmp/tile.png)" -gt 1000
          echo "tile bytes $(wc -c < /tmp/tile.png)"
