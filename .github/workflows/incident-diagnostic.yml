name: Incident diagnostic

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/incident-diagnostic.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Classify recent production server errors
        shell: bash
        run: |
          set -euo pipefail
          RAW="$(npx wrangler d1 execute DB --remote --json --command "SELECT request_id,path,method,message,created_at FROM server_errors WHERE method!='CLIENT' ORDER BY created_at DESC LIMIT 60" 2>/dev/null)"
          export RAW
          node <<'NODE'
          const raw=JSON.parse(process.env.RAW||"[]");
          const rows=Array.isArray(raw)?raw.flatMap(x=>x.results||[]):[];
          const sanitizePath=p=>String(p||"").replace(/[0-9a-f]{8}-[0-9a-f-]{27,}/ig,":id").replace(/\b\d{12,}\b/g,":num");
          const sanitizeMessage=m=>{
            const s=String(m||"");
            const d1=s.match(/D1_ERROR:\s*([^\n]+)/i)?.[1]||s;
            return d1
              .replace(/[0-9a-f]{8}-[0-9a-f-]{27,}/ig,":id")
              .replace(/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/g,":email")
              .replace(/\b05\d[- ]?\d{7}\b/g,":phone")
              .slice(0,500);
          };
          for(const r of rows) console.log(JSON.stringify({
            requestId:r.request_id,
            path:sanitizePath(r.path),
            method:r.method,
            error:sanitizeMessage(r.message),
            createdAt:r.created_at
          }));
          NODE
