name: Audit email delivery (read only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/email-delivery-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read live template switches and delivery evidence
        run: |
          npx wrangler d1 execute DB --remote --command "SELECT template_key,language,enabled FROM email_templates ORDER BY template_key,language" --json
          npx wrangler d1 execute DB --remote --command "SELECT 'operational_email_sent' AS metric,COUNT(*) AS n FROM notification_delivery_log WHERE channel='email' AND status='sent' AND attempted_at>='2026-10-04T08:47:35Z' UNION ALL SELECT 'queue_email_sent',COUNT(*) FROM notification_queue WHERE channel IN ('email','digest') AND sent_at>='2026-10-04T08:47:35Z' AND error IS NULL UNION ALL SELECT 'queue_email_suppressed',COUNT(*) FROM notification_queue WHERE channel IN ('email','digest') AND sent_at>='2026-10-04T08:47:35Z' AND error LIKE 'suppressed:%' UNION ALL SELECT 'admin_alert_sent',COUNT(*) FROM system_alert_deliveries WHERE channel='email' AND status='sent' AND sent_at>='2026-10-04T08:47:35Z' UNION ALL SELECT 'daily_digest_sent',COUNT(*) FROM notification_digests WHERE status='sent' AND sent_at>='2026-10-04T08:47:35Z'" --json
