name: Audit email delivery (read only)
on:
  push:
    branches: [main]
    paths: [".github/workflows/email-delivery-audit.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read live template switches and delivery evidence
        run: |
          npx wrangler d1 execute DB --remote --command "SELECT template_key,language,enabled FROM email_templates ORDER BY template_key,language" --json
          npx wrangler d1 execute DB --remote --command "SELECT name FROM sqlite_master WHERE type='table'" --json > audit-tables.json
          node <<'NODE'
          const fs=require('fs'),tables=new Set(require('./audit-tables.json')[0].results.map(x=>x.name));
          const specs=[
            ['notification_delivery_log','operational_email_sent',"channel='email' AND status='sent' AND attempted_at>='2026-10-04T08:47:35Z'"],
            ['notification_queue','queue_email_sent',"channel IN ('email','digest') AND sent_at>='2026-10-04T08:47:35Z' AND error IS NULL"],
            ['notification_queue','queue_email_suppressed',"channel IN ('email','digest') AND sent_at>='2026-10-04T08:47:35Z' AND error LIKE 'suppressed:%'"],
            ['system_alert_deliveries','admin_alert_sent',"channel='email' AND status='sent' AND sent_at>='2026-10-04T08:47:35Z'"],
            ['notification_digests','daily_digest_sent',"status='sent' AND sent_at>='2026-10-04T08:47:35Z'"]
          ];
          const queries=specs.map(([table,metric,where])=>tables.has(table)?`SELECT '${metric}' AS metric,COUNT(*) AS n FROM ${table} WHERE ${where}`:`SELECT '${metric}: log table absent' AS metric,NULL AS n`);
          fs.writeFileSync('audit-counts.sql',queries.join(' UNION ALL ')+';');
          NODE
          npx wrangler d1 execute DB --remote --command "$(cat audit-counts.sql)" --json

      - name: Read waitlist delivery times without personal information
        run: |
          npx wrangler d1 execute DB --remote --command "SELECT n.id,n.type,n.title,n.created_at,l.channel,l.status,l.attempted_at,l.error FROM notifications n LEFT JOIN notification_delivery_log l ON l.notification_id=n.id WHERE n.title='הפריט שביקשתם זמין' AND n.created_at>='2026-10-03' ORDER BY n.created_at DESC LIMIT 30" --json
          npx wrangler d1 execute DB --remote --command "SELECT notification_type,channel,title,scheduled_at,sent_at,failed_at,error FROM notification_queue WHERE title='הפריט שביקשתם זמין' AND scheduled_at>='2026-10-03' ORDER BY scheduled_at DESC LIMIT 30" --json
