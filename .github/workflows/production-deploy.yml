name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "worker/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package*.json"
      - "test/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Production deployment needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets." >&2
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Detect migration changes
        id: migration_changes
        run: |
          if git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- migrations/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No database migration changed in this deployment; D1 snapshot/migration steps will be skipped."
          fi
      - run: npm ci
      - run: npm run check
      - name: Run production test suite
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          npm test 2>&1 | tee production-test-output.log
      - name: Persist production test failure
        if: steps.tests.outcome != 'success'
        continue-on-error: true
        run: |
          {
            echo "deploy_sha=${GITHUB_SHA}"
            echo "deploy_tests=${{ steps.tests.outcome }}"
            tail -n 100 production-test-output.log
          } > .deploy-test-failure
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-test-failure
          git commit -m "Record production test failure" || true
          git pull --rebase origin main || true
          git push || echo "::warning::Could not persist production test failure because main advanced."
      - name: Enforce production tests
        if: always()
        run: test "${{ steps.tests.outcome }}" = "success"
      - name: Ensure dedicated backup R2 bucket
        run: |
          set +e
          OUTPUT="$(npx wrangler r2 bucket create gmach-karov-backups 2>&1)"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "$OUTPUT"
          elif echo "$OUTPUT" | grep -qi "already exists"; then
            echo "Backup bucket already exists."
          else
            echo "$OUTPUT" >&2
            exit "$STATUS"
          fi

      - name: Create pre-migration D1 snapshot
        if: steps.migration_changes.outputs.changed == 'true'
        run: |
          mkdir -p .deploy-backups
          npx wrangler d1 export DB --remote --output ".deploy-backups/d1-before-${GITHUB_SHA}.sql"

      - name: Upload pre-migration snapshot
        if: steps.migration_changes.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: d1-before-${{ github.sha }}
          path: .deploy-backups/d1-before-${{ github.sha }}.sql
          retention-days: 30
          if-no-files-found: error

      - name: Apply pending production database migrations
        run: |
          set +e
          OUTPUT="$(npx wrangler d1 migrations apply DB --remote 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            if echo "$OUTPUT" | grep -Eqi "duplicate column name|already exists"; then
              echo "::warning::The live D1 schema is ahead of the Wrangler migration ledger. Continuing with runtime idempotent schema reconciliation."
            else
              exit "$STATUS"
            fi
          fi
      - name: Reconcile per-gmach serial identities directly
        run: npx wrangler d1 execute DB --remote --file migrations/0017_per_gmach_item_serials.sql
      - name: Backfill missing serialized units directly
        run: npx wrangler d1 execute DB --remote --file migrations/0018_backfill_missing_item_units.sql
      - name: Rebase gmach serial codes to high range
        run: npx wrangler d1 execute DB --remote --file migrations/0019_high_gmach_serial_codes.sql
      - name: Publish production Worker
        run: |
          for attempt in 1 2 3; do
            if npx wrangler deploy; then exit 0; fi
            echo "::warning::Cloudflare deploy attempt $attempt failed; retrying..."
            sleep $((attempt * 5))
          done
          exit 1
      - name: Verify live health on custom domain
        run: |
          for i in {1..18}; do
            body="$(curl --fail --silent --show-error --max-time 10 'https://gmach-berega.co.il/api/health?deep=1' || true)"
            echo "$body"
            if echo "$body" | grep -q '"ok":true' &&
               echo "$body" | grep -q '"catalog":true' &&
               echo "$body" | grep -q '"categories":true'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Verify public gmach data is complete
        run: |
          origin='https://gmach-berega.co.il'
          org_id="$(curl --fail --silent --show-error --max-time 20 "$origin/api/discovery" | jq -r '.organizations[0].id // empty')"
          if [ -z "$org_id" ]; then
            echo "No listed gmach to verify."
            exit 0
          fi
          for attempt in 1 2 3; do
            body="$(curl --fail --silent --show-error --max-time 20 "$origin/api/organizations/$org_id/public")"
            if printf '%s' "$body" | jq -e '.partial == false and (.items | length) > 0 and (.organization | has("contact_phone") | not) and (.organization.address | type == "string" and length > 0)' >/dev/null; then
              echo "Public gmach address and contact privacy verified."
              exit 0
            fi
            printf '%s' "$body" | jq '{partial,partialSections,itemCount:(.items|length)}'
            sleep 5
          done
          exit 1
      - name: Read-only production load gate
        if: github.event_name == 'workflow_dispatch'
        env:
          PRODUCTION_URL: https://gmach-berega.co.il
        run: node test/production-load.mjs

      - name: Verify external security and notification configuration
        id: capabilities
        continue-on-error: true
        run: |
          FEATURES="$(curl --fail --silent --show-error --max-time 30 https://gmach-berega.co.il/api/platform/features)"
          echo "$FEATURES" | tee production-features.json
          printf '%s' "$FEATURES" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(!x.turnstileEnabled||!x.turnstileSiteKey)throw new Error('Turnstile is not active in production');if(!x.pushConfigured||!x.vapidPublicKey)throw new Error('Web Push VAPID is not active in production');if(!x.backups||!x.calendar||!x.chatMedia||!x.geocoding)throw new Error('One or more required platform capabilities are inactive')})"
      - name: Persist production capability failure
        if: steps.capabilities.outcome == 'failure'
        continue-on-error: true
        run: |
          {
            echo "deploy_sha=${GITHUB_SHA}"
            echo "capabilities=${{ steps.capabilities.outcome }}"
            cat production-features.json 2>/dev/null || true
          } > .deploy-capability-failure
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-capability-failure
          git commit -m "Record production capability failure" || true
          git push
      - name: Report production capability status
        if: steps.capabilities.outcome == 'failure'
        run: echo '::warning::Core production deployment succeeded, but an external capability is not active. See provisioning workflow for the actionable blocker.'
