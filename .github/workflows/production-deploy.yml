name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "worker/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package*.json"
      - ".github/workflows/production-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Production deployment needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets." >&2
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Ensure dedicated backup R2 bucket
        run: |
          set +e
          OUTPUT="$(npx wrangler r2 bucket create gmach-karov-backups 2>&1)"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "$OUTPUT"
          elif echo "$OUTPUT" | grep -qi "already exists"; then
            echo "Backup bucket already exists."
          else
            echo "$OUTPUT" >&2
            exit "$STATUS"
          fi

      - name: Create pre-migration D1 snapshot
        run: |
          mkdir -p .deploy-backups
          npx wrangler d1 export DB --remote --output ".deploy-backups/d1-before-${GITHUB_SHA}.sql"

      - name: Upload pre-migration snapshot
        uses: actions/upload-artifact@v4
        with:
          name: d1-before-${{ github.sha }}
          path: .deploy-backups/d1-before-${{ github.sha }}.sql
          retention-days: 30
          if-no-files-found: error

      - name: Apply production database migrations
        run: |
          set +e
          OUTPUT="$(npx wrangler d1 migrations apply DB --remote 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            if echo "$OUTPUT" | grep -Eqi "duplicate column name|already exists"; then
              echo "::warning::The live D1 schema is ahead of the Wrangler migration ledger. Continuing with the runtime idempotent schema reconciliation already built into the Worker."
            else
              exit "$STATUS"
            fi
          fi
      - name: Publish production Worker
        run: npx wrangler deploy
      - name: Verify live health
        run: |
          for i in {1..12}; do
            if curl --fail --silent --show-error https://gmach-karov1.nh8030954.workers.dev/api/health | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
