name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "worker/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package*.json"
      - "test/**"
      - ".github/workflows/production-deploy.yml"
      - ".github/workflows/verify.yml"
      - ".github/workflows/release-checks.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Production deployment needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets." >&2
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Run production test suite
        id: tests
        continue-on-error: true
        run: npm test 2>&1 | tee production-test-output.log
      - name: Persist production test failure
        if: steps.tests.outcome != 'success'
        run: |
          {
            echo "deploy_sha=${GITHUB_SHA}"
            echo "deploy_tests=${{ steps.tests.outcome }}"
            tail -n 100 production-test-output.log
          } > .deploy-test-failure
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deploy-test-failure
          git commit -m "Record production test failure" || true
          git push
      - name: Enforce production tests
        run: test "${{ steps.tests.outcome }}" = "success"
      - name: Ensure dedicated backup R2 bucket
        run: |
          set +e
          OUTPUT="$(npx wrangler r2 bucket create gmach-karov-backups 2>&1)"
          STATUS=$?
          set -e
          if [ "$STATUS" -eq 0 ]; then
            echo "$OUTPUT"
          elif echo "$OUTPUT" | grep -qi "already exists"; then
            echo "Backup bucket already exists."
          else
            echo "$OUTPUT" >&2
            exit "$STATUS"
          fi

      - name: Create pre-migration D1 snapshot
        run: |
          mkdir -p .deploy-backups
          npx wrangler d1 export DB --remote --output ".deploy-backups/d1-before-${GITHUB_SHA}.sql"

      - name: Upload pre-migration snapshot
        uses: actions/upload-artifact@v4
        with:
          name: d1-before-${{ github.sha }}
          path: .deploy-backups/d1-before-${{ github.sha }}.sql
          retention-days: 30
          if-no-files-found: error

      - name: Apply production database migrations
        run: |
          set +e
          OUTPUT="$(npx wrangler d1 migrations apply DB --remote 2>&1)"
          STATUS=$?
          set -e
          echo "$OUTPUT"
          if [ "$STATUS" -ne 0 ]; then
            if echo "$OUTPUT" | grep -Eqi "duplicate column name|already exists"; then
              echo "::warning::The live D1 schema is ahead of the Wrangler migration ledger. Continuing with the runtime idempotent schema reconciliation already built into the Worker."
            else
              exit "$STATUS"
            fi
          fi
      - name: Publish production Worker
        run: npx wrangler deploy
      - name: Verify live health
        run: |
          for i in {1..12}; do
            if curl --fail --silent --show-error https://gmach-karov1.nh8030954.workers.dev/api/health | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Verify external security and notification configuration
        run: |
          FEATURES="$(curl --fail --silent --show-error https://gmach-karov1.nh8030954.workers.dev/api/platform/features)"
          echo "$FEATURES"
          printf '%s' "$FEATURES" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const x=JSON.parse(s);if(!x.turnstileEnabled||!x.turnstileSiteKey)throw new Error('Turnstile is not active in production');if(!x.pushConfigured||!x.vapidPublicKey)throw new Error('Web Push VAPID is not active in production');if(!x.backups||!x.calendar||!x.chatMedia||!x.geocoding)throw new Error('One or more required platform capabilities are inactive')})"
