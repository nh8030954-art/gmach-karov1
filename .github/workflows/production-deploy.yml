name: Deploy production

on:
  push:
    branches: [main]
    paths:
      - "dist/**"
      - "worker/**"
      - "migrations/**"
      - "wrangler.jsonc"
      - "package*.json"
      - ".github/workflows/production-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check deployment credentials
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Production deployment needs CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets." >&2
            exit 1
          fi
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Apply production database migrations
        run: npx wrangler d1 migrations apply DB --remote
      - name: Publish production Worker
        run: npx wrangler deploy
      - name: Verify live health
        run: |
          for i in {1..12}; do
            if curl --fail --silent --show-error https://gmach-karov1.nh8030954.workers.dev/api/health | grep -q '"ok":true'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
