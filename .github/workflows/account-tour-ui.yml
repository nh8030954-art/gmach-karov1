name: Account tour browser checks
on:
  push:
    branches: [feature/account-spotlight-tour]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm install --no-save playwright@1.55.0
      - run: npx playwright install --with-deps chromium
      - run: mkdir -p test/tour-screenshots && node test/account-tour-ui.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-tour-previews
          path: test/tour-screenshots/
