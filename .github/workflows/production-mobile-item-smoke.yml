name: Production mobile item smoke
on:
  push:
    branches: [qa]
    paths:
      - ".github/workflows/production-mobile-item-smoke.yml"
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Verify production mobile item details
        run: |
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            for(const lang of ['he','en']){
              const ctx=await browser.newContext({viewport:{width:390,height:844},isMobile:true,hasTouch:true,locale:lang==='en'?'en-US':'he-IL'});
              await ctx.addInitScript(({lang})=>{localStorage.setItem('gmach-language',lang)},{lang});
              const page=await ctx.newPage();
              const res=await page.goto('https://gmach-karov1.nh8030954.workers.dev/#/catalog',{waitUntil:'domcontentloaded',timeout:30000});
              if(!res || res.status()!==200) throw new Error('catalog HTTP '+res?.status());
              await page.waitForTimeout(1800);
              const button=page.locator('[data-open-item]').first();
              if(!(await button.count())) throw new Error(lang+': no item details button');
              if(!(await button.isVisible())) throw new Error(lang+': item details button hidden on mobile');
              const box=await button.boundingBox();
              if(!box || box.height<40) throw new Error(lang+': item details touch target too small');
              await button.click();
              await page.waitForTimeout(300);
              const open=await page.locator('#item-dialog').evaluate(el=>el.open);
              if(!open) throw new Error(lang+': item dialog did not open');
              console.log(lang+': mobile item dialog OK');
              await ctx.close();
            }
          } finally { await browser.close(); }
          NODE
