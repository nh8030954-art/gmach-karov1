name: Verify released account emails 20261011
on:
  push:
    branches: [main]
    paths: [".github/workflows/verify-released-emails-20261011.yml"]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify all six requested email addresses are unreserved
        run: |
          node <<'NODE'
          const {execFileSync}=require('node:child_process');
          const {createHash}=require('node:crypto');
          const targets=["669f378e01e5f8670ab3594c6cd4d486c65013f6548ae6def9a9d62cb42094be","e539e87dcc095a123fa0327dc1944b5c56b2608afad28e76635a61bed9d83415","4a8bd9d512e6817dcf67fd464cd268d272cd8c553b4ecb05f0688dd6caae5d57","71f8520de2824072d729ab5608e83b659ea4e08bd753583cce7ec73e1f44d35e","7f2b6f8700574d6bb64ab7227599578537ee43eebe7b4c3b1afda8c0d4a2960e","5c608c0fdefc90d15d427aa3fdb00f42c40b869dd225f75a51821391c0615ddd"];
          const raw=execFileSync('npx',['wrangler','d1','execute','DB','--remote','--json','--command','SELECT email FROM users'],{encoding:'utf8',maxBuffer:8*1024*1024});
          const response=JSON.parse(raw);
          if(response.some(result=>result.success===false))throw new Error('Email verification query failed');
          const used=new Set(response.flatMap(result=>result.results||[]).map(user=>createHash('sha256').update(String(user.email).trim().toLowerCase()).digest('hex')));
          for(let index=0;index<targets.length;index++){
           const available=!used.has(targets[index]);
           console.log('EMAIL_AVAILABLE '+JSON.stringify({index:index+1,available}));
           if(!available)throw new Error('Email is still reserved: '+(index+1));
          }
          
          NODE
