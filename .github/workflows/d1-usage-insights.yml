name: Read QA D1 query insights
on:
  push:
    branches: [fix/admin-delete-500]
    paths: [".github/workflows/d1-usage-insights.yml"]
permissions:
  contents: read
jobs:
  insights:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read QA top write queries
        run: npx wrangler d1 insights gmach-karov-db-qa --sort-type=sum --sort-by=writes --limit=8 --timePeriod=6h --json
      - name: Read QA top read queries
        run: npx wrangler d1 insights gmach-karov-db-qa --sort-type=sum --sort-by=reads --limit=5 --timePeriod=6h --json
