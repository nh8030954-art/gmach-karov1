name: Gmach Full Production Backup

on:
  workflow_dispatch:
  schedule:
    - cron: '30 0 * * *'

permissions:
  contents: read

concurrency:
  group: gmach-full-production-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Full production backup
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install project tooling
        run: npm ci
      - name: Install archive tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq jq zip unzip
      - name: Verify Cloudflare backup credentials
        run: |
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
      - name: Run full verified backup
        run: |
          chmod +x .github/scripts/gmach-full-backup.sh
          .github/scripts/gmach-full-backup.sh
