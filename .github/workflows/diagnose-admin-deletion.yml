name: Diagnose admin deletion (read only)
on:
  push:
    branches: [fix/admin-delete-500]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Read specific error and schema
        run: |
          npx wrangler d1 execute DB --remote --command "SELECT id,path,method,message,stack_excerpt FROM server_errors WHERE id='179113611153554915' OR (method='DELETE' AND path LIKE '%admin%' AND created_at>='2026-10-04') ORDER BY created_at DESC LIMIT 8; PRAGMA table_info(organizations); PRAGMA table_info(items); SELECT name,sql FROM sqlite_master WHERE type='trigger' AND tbl_name IN ('organizations','items');" --json
