name: Delete requested unverified registration
on:
  push:
    branches: [main]
    paths: [".github/workflows/delete-requested-registration.yml"]
permissions:
  contents: read
jobs:
  remove:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Delete only the requested incomplete registration
        run: |
          npx wrangler d1 execute DB --remote --yes --json --command "DELETE FROM users WHERE email='galitrgilad@gmail.com' COLLATE NOCASE AND email_verified=0 AND role NOT IN ('admin','super_admin') AND NOT EXISTS(SELECT 1 FROM organizations WHERE owner_id=users.id); SELECT COUNT(*) AS remaining_requested_account FROM users WHERE email='galitrgilad@gmail.com' COLLATE NOCASE"
