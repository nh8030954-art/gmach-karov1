name: Deliver private gmach research
on:
  push:
    branches: [main]
    paths: [".research-inbox/*.json"]
permissions:
  contents: read
concurrency:
  group: gmach-research-ingest
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Deliver encrypted evidence to private administrator storage
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node .github/scripts/ingest-gmach-research.mjs
