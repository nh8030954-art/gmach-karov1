name: Clear requested community board entries
on:
  push:
    branches: [main]
    paths: [".github/workflows/clear-request-board-20261009.yml"]
permissions:
  contents: read
jobs:
  clear:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Delete only the three existing public board requests requested by the owner
        run: |
          npx wrangler d1 execute DB --remote --yes --json --command "SELECT COUNT(*) AS selected_requests_before FROM help_requests WHERE id IN ('affa6502-ef23-4486-90a5-9cb9e9c44847','2c382598-0941-4ce1-aa39-2e1891786970','c26699c3-02af-4e5e-8465-b55ea921f808') AND status='open'; DELETE FROM help_requests WHERE id IN ('affa6502-ef23-4486-90a5-9cb9e9c44847','2c382598-0941-4ce1-aa39-2e1891786970','c26699c3-02af-4e5e-8465-b55ea921f808') AND status='open'; SELECT COUNT(*) AS selected_open_requests_remaining FROM help_requests WHERE id IN ('affa6502-ef23-4486-90a5-9cb9e9c44847','2c382598-0941-4ce1-aa39-2e1891786970','c26699c3-02af-4e5e-8465-b55ea921f808') AND status='open'" > board-clear-result.json
          node - <<'NODE'
          const result=require('./board-clear-result.json');
          const rows=result.flatMap(x=>x.results||[]);
          const before=rows.find(x=>Object.hasOwn(x,'selected_requests_before'));
          const remaining=rows.find(x=>Object.hasOwn(x,'selected_open_requests_remaining'));
          if(!before||!remaining||Number(remaining.selected_open_requests_remaining)!==0)throw new Error('Requested board clear verification failed');
          console.log(JSON.stringify({deletedRequests:Number(before.selected_requests_before),selectedOpenRequestsRemaining:Number(remaining.selected_open_requests_remaining)}));
          NODE
