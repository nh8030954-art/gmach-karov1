name: Provision requested site administrator

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/admin-bootstrap.yml"
      - "migrations/0030_admin_bootstrap.sql"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Production predates the Wrangler migration ledger. This SQL is idempotent,
      # preserves existing passwords and never stores a plaintext credential.
      - name: Provision account in production D1
        run: npx wrangler d1 execute DB --remote --yes --file migrations/0030_admin_bootstrap.sql
