name: Live outreach statistics
on:
  push:
    branches: [main]
    paths: [".github/workflows/live-outreach-statistics.yml"]
permissions:
  contents: read
jobs:
  stats:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: users
        run: npx wrangler d1 execute DB --remote --json --command "SELECT COUNT(*) AS total,SUM(email_verified=1) AS verified,SUM(email_verified=0) AS unverified,SUM(role='admin') AS admins,SUM(created_at>=strftime('%Y-%m-%dT%H:%M:%fZ','now','-3 hours')) AS last_3h FROM users WHERE deleted_at IS NULL"
      - name: gmachs
        run: npx wrangler d1 execute DB --remote --json --command "SELECT COUNT(*) AS total,SUM(status='approved' AND is_hidden=0) AS public,SUM(EXISTS(SELECT 1 FROM items i WHERE i.organization_id=o.id AND i.status='active')) AS with_active_items,COUNT(DISTINCT owner_id) AS distinct_owners FROM organizations o WHERE deleted_at IS NULL"
      - name: items
        run: npx wrangler d1 execute DB --remote --json --command "SELECT status,COUNT(*) AS count,SUM(quantity) AS quantity FROM items GROUP BY status"
      - name: loans
        run: npx wrangler d1 execute DB --remote --json --command "SELECT status,COUNT(*) AS count,COUNT(DISTINCT borrower_id) AS borrowers FROM loan_requests GROUP BY status"
      - name: contact_requests
        run: npx wrangler d1 execute DB --remote --json --command "SELECT status,COUNT(*) AS count FROM organization_chat_requests GROUP BY status"
      - name: today_visits
        run: npx wrangler d1 execute DB --remote --json --command "SELECT COUNT(DISTINCT visitor_id) AS visitors,COUNT(*) AS sessions,SUM(views) AS pageviews,SUM(registered=1) AS registered_sessions FROM site_visits WHERE started_at>=strftime('%Y-%m-%dT00:00:00.000Z','now','+3 hours','start of day','-3 hours')"
      - name: visits_by_day
        run: npx wrangler d1 execute DB --remote --json --command "SELECT date(started_at,'+3 hours') AS day,COUNT(DISTINCT visitor_id) AS visitors,COUNT(*) AS sessions,SUM(views) AS pageviews FROM site_visits GROUP BY day ORDER BY day DESC LIMIT 7"
      - name: registrations_by_day
        run: npx wrangler d1 execute DB --remote --json --command "SELECT date(created_at,'+3 hours') AS day,COUNT(*) AS registrations FROM users WHERE deleted_at IS NULL AND role!='admin' GROUP BY day ORDER BY day DESC LIMIT 7"
      - name: new_gmachs_by_day
        run: npx wrangler d1 execute DB --remote --json --command "SELECT date(created_at,'+3 hours') AS day,COUNT(*) AS gmachs FROM organizations WHERE deleted_at IS NULL GROUP BY day ORDER BY day DESC LIMIT 7"
