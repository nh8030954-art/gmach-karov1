name: Fix category carousel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-carousel.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch carousel
        shell: python
        run: |
          from pathlib import Path
          import re

          app = Path('dist/app.js')
          s = app.read_text(encoding='utf-8')
          start = s.find('// Category carousel continuous autoplay v2')
          if start != -1:
              s = s[:start].rstrip() + '\n\n'
          s += r'''// Category carousel continuous autoplay v3
          (()=>{
            const ready=()=>{
              const rail=document.getElementById('category-rail');
              if(!rail || rail.dataset.continuousCarousel==='1') return;
              rail.dataset.continuousCarousel='1';
              rail.classList.add('carousel-ready','carousel-continuous');
              const originals=[...rail.children];
              if(originals.length<2) return;
              originals.forEach(el=>{ const clone=el.cloneNode(true); clone.setAttribute('aria-hidden','true'); clone.tabIndex=-1; rail.appendChild(clone); });
              let paused=false, last=performance.now(), raf=0;
              const speed=window.innerWidth<=760 ? 62 : 48;
              const rtl=document.documentElement.dir==='rtl';
              const half=()=>rail.scrollWidth/2;
              const tick=(now)=>{
                const dt=Math.min(40,now-last); last=now;
                if(!paused && !document.hidden){
                  const delta=speed*dt/1000;
                  rail.scrollLeft += rtl ? -delta : delta;
                  const h=half();
                  if(Math.abs(rail.scrollLeft)>=h-2) rail.scrollLeft=0;
                }
                raf=requestAnimationFrame(tick);
              };
              let resume;
              const pause=()=>{ paused=true; clearTimeout(resume); };
              const restart=()=>{ clearTimeout(resume); resume=setTimeout(()=>paused=false,450); };
              rail.addEventListener('pointerdown',pause,{passive:true});
              rail.addEventListener('pointerup',restart,{passive:true});
              rail.addEventListener('pointercancel',restart,{passive:true});
              rail.addEventListener('touchend',restart,{passive:true});
              rail.addEventListener('wheel',()=>{pause();restart();},{passive:true});
              raf=requestAnimationFrame(tick);
            };
            if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',ready,{once:true}); else ready();
          })();
          '''
          app.write_text(s,encoding='utf-8')

          index=Path('dist/index.html')
          h=index.read_text(encoding='utf-8')
          h=re.sub(r'<style id="category-carousel-v1">.*?</style>', r'''<style id="category-carousel-v1">
            .category-rail.carousel-ready{display:flex!important;gap:12px;overflow-x:auto!important;overflow-y:hidden;scroll-snap-type:none!important;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-inline:contain}
            .category-rail.carousel-ready::-webkit-scrollbar{display:none}
            .category-rail.carousel-ready .category-card{flex:0 0 158px!important;width:158px!important;min-width:158px!important;min-height:155px!important;scroll-snap-align:none!important}
            .category-rail.carousel-ready .category-icon{width:54px!important;height:54px!important}
            .category-rail.carousel-ready .category-icon svg{width:28px!important;height:28px!important}
            @media(max-width:760px){.category-rail.carousel-ready{gap:12px;padding-bottom:4px}.category-rail.carousel-ready .category-card{flex-basis:168px!important;width:168px!important;min-width:168px!important}}
          </style>''',h,flags=re.S)
          index.write_text(h,encoding='utf-8')
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/app.js dist/index.html
          git diff --cached --quiet || git commit -m "Make category carousel continuous and restore card sizing"
          git push
