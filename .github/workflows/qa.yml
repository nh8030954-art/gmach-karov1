name: QA deploy and tests

on:
  workflow_dispatch:
  push:
    branches: [qa]

permissions:
  contents: read

concurrency:
  group: qa-deploy
  cancel-in-progress: true

jobs:
  qa:
    if: ${{ false }} # QA paused by owner; re-enable only on explicit request.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QA_URL: https://gmach-karov1-qa.nh8030954.workers.dev
      QA_R2_BUCKET: gmach-karov-images-qa
      QA_BACKUP_BUCKET: gmach-karov-backups-qa
      QA_RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      QA_DATA_ENCRYPTION_KEY: ${{ secrets.DATA_ENCRYPTION_KEY }}
    steps:
      - name: Check QA configuration
        id: config
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "QA deployment blocked: Cloudflare account credentials are not configured." >&2
            exit 1
          fi
          if [ -z "$QA_RESEND_API_KEY" ] || [ -z "$QA_DATA_ENCRYPTION_KEY" ]; then
            echo "QA deployment blocked: RESEND_API_KEY and DATA_ENCRYPTION_KEY repository secrets are required for end-to-end account testing." >&2
            exit 1
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.config.outputs.enabled == 'true'
      - uses: actions/setup-node@v5
        if: steps.config.outputs.enabled == 'true'
        with:
          node-version: 24
          cache: npm
      - run: npm ci
        if: steps.config.outputs.enabled == 'true'
      - run: npm run check
        if: steps.config.outputs.enabled == 'true'
      - run: npm test
        if: steps.config.outputs.enabled == 'true'
      - name: Provision isolated QA resources
        if: steps.config.outputs.enabled == 'true'
        run: |
          set -euo pipefail
          DB_JSON="$(npx wrangler d1 list --json)"
          QA_D1_DATABASE_ID="$(node -e 'const a=JSON.parse(process.argv[1]); const d=a.find(x=>x.name==="gmach-karov-db-qa"); if(d) process.stdout.write(d.uuid||d.id||"")' "$DB_JSON")"
          if [ -z "$QA_D1_DATABASE_ID" ]; then
            npx wrangler d1 create gmach-karov-db-qa >/tmp/qa-d1-create.txt
            DB_JSON="$(npx wrangler d1 list --json)"
            QA_D1_DATABASE_ID="$(node -e 'const a=JSON.parse(process.argv[1]); const d=a.find(x=>x.name==="gmach-karov-db-qa"); if(!d) process.exit(2); process.stdout.write(d.uuid||d.id)' "$DB_JSON")"
          fi
          npx wrangler r2 bucket create "$QA_R2_BUCKET" >/dev/null 2>&1 || true
          npx wrangler r2 bucket create "$QA_BACKUP_BUCKET" >/dev/null 2>&1 || true
          echo "QA_D1_DATABASE_ID=$QA_D1_DATABASE_ID" >> "$GITHUB_ENV"
      - name: Build QA Wrangler config
        if: steps.config.outputs.enabled == 'true'
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('wrangler.qa.template.jsonc','utf8')
            .replaceAll('__QA_D1_DATABASE_ID__',process.env.QA_D1_DATABASE_ID)
            .replaceAll('__QA_R2_BUCKET__',process.env.QA_R2_BUCKET)
            .replaceAll('__QA_BACKUP_BUCKET__',process.env.QA_BACKUP_BUCKET);
          fs.writeFileSync('wrangler.qa.jsonc',raw);
          NODE
      - name: Apply QA migrations
        if: steps.config.outputs.enabled == 'true'
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.qa.jsonc
      - name: Add fictional QA catalog
        if: steps.config.outputs.enabled == 'true'
        run: |
          node test/qa-demo-seed.mjs /tmp/qa-demo-seed.sql
          npx wrangler d1 execute DB --remote --config wrangler.qa.jsonc --file /tmp/qa-demo-seed.sql
      - name: Deploy QA Worker
        if: steps.config.outputs.enabled == 'true'
        run: npx wrangler deploy --config wrangler.qa.jsonc
      - name: Configure QA email and private-data encryption
        if: steps.config.outputs.enabled == 'true'
        run: |
          printf '%s' "$QA_RESEND_API_KEY" | npx wrangler secret put RESEND_API_KEY --config wrangler.qa.jsonc
          printf '%s' "$QA_DATA_ENCRYPTION_KEY" | npx wrangler secret put DATA_ENCRYPTION_KEY --config wrangler.qa.jsonc
      - name: Smoke QA
        if: steps.config.outputs.enabled == 'true'
        run: |
          for i in {1..18}; do
            body="$(curl -fsS "${QA_URL}/api/health?deep=1" || true)"
            echo "$body"
            if echo "$body" | grep -q '"ok":true' &&
               echo "$body" | grep -q '"catalog":true' &&
               echo "$body" | grep -q '"categories":true' &&
               echo "$body" | grep -q '"email":true' &&
               echo "$body" | grep -q '"privateDataEncryption":true'; then
              exit 0
            fi
            sleep 10
          done
          exit 1
      - name: Moderate QA load test
        if: steps.config.outputs.enabled == 'true' && github.event_name == 'workflow_dispatch'
        run: node test/qa-load.mjs
