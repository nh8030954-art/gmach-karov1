name: QA deploy and tests

on:
  workflow_dispatch:
  push:
    branches: [qa]

permissions:
  contents: read

concurrency:
  group: qa-deploy
  cancel-in-progress: true

jobs:
  qa:
    if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' && secrets.QA_D1_DATABASE_ID != '' && secrets.QA_URL != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      QA_D1_DATABASE_ID: ${{ secrets.QA_D1_DATABASE_ID }}
      QA_R2_BUCKET: ${{ secrets.QA_R2_BUCKET }}
      QA_URL: ${{ secrets.QA_URL }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build QA Wrangler config
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const raw=fs.readFileSync('wrangler.qa.template.jsonc','utf8')
            .replaceAll('__QA_D1_DATABASE_ID__',process.env.QA_D1_DATABASE_ID)
            .replaceAll('__QA_R2_BUCKET__',process.env.QA_R2_BUCKET||'gmach-karov-images-qa');
          fs.writeFileSync('wrangler.qa.jsonc',raw);
          NODE
      - name: Apply QA migrations
        run: npx wrangler d1 migrations apply DB --remote --config wrangler.qa.jsonc
      - name: Deploy QA Worker
        run: npx wrangler deploy --config wrangler.qa.jsonc
      - name: Smoke QA
        run: |
          for i in {1..18}; do
            body="$(curl -fsS ${QA_URL}/api/health || true)"
            echo "$body"
            if echo "$body" | grep -q '"ok":true'; then exit 0; fi
            sleep 10
          done
          exit 1
      - name: Moderate QA load test
        run: node test/qa-load.mjs
