<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>גמ״ח ברגע</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Arial,"Assistant",sans-serif}
body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#f7f8f8;color:#15313a}
main{width:min(700px,100%);text-align:center;background:#fff;border-radius:28px;padding:42px 28px;box-shadow:0 18px 55px rgba(21,49,58,.12)}
img{display:block;max-width:260px;width:70%;height:auto;margin:0 auto 24px}
h1{font-size:clamp(2.4rem,8vw,4.6rem);margin:0 0 16px;color:#243f75}
p{font-size:clamp(1rem,2.6vw,1.25rem);line-height:1.75;margin:8px auto;max-width:560px;color:#50666d}
</style>
</head>
<body>
<main>
<img src="/gmach-berega-logo.jpg" alt="גמ״ח ברגע">
<h1 id="title">שבת שלום</h1>
<p id="message">גמ״ח ברגע סגור כעת לכבוד השבת.</p>
<p id="reopen"></p>

</main>
<script>
(function(){
 const q=new URLSearchParams(location.search),type=q.get("type"),holiday=q.get("title")||"החג";
 const t=document.getElementById("title"),m=document.getElementById("message");
 if(type==="holiday"){t.textContent="חג שמח";m.textContent="גמ״ח ברגע סגור כעת לכבוד "+holiday+"."}
 else if(type==="both"){t.textContent="שבת שלום וחג שמח";m.textContent="גמ״ח ברגע סגור כעת לכבוד השבת ו"+holiday+"."}
 const r=q.get("reopens");
 if(r){
  try{document.getElementById("reopen").textContent="האתר ישוב לפעילות בעזרת ה׳ במוצאי שבת."}catch{}
 }
})();
</script>
</body>
</html>
